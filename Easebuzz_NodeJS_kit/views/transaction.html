<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Transaction V2 - Easebuzz</title>
  <link rel="stylesheet" href="/public/css/style.css">
</head>
<body>
  <div class="header">
    <div class="logo">
      <a href="/public/index.html"><img src="/public/images/Easebuzz_Logo_ White_Text.svg" alt="Easebuzz"></a>
    </div>
    <div class="nav-right">
      <div class="toggle-container">
        <span>Auto Fill Data</span>
        <label class="toggle-switch">
          <input type="checkbox" id="autoFillToggle">
          <span class="toggle-slider"></span>
        </label>
      </div>
      <a href="/public/index.html">Back</a>
    </div>
  </div>

  <div class="main-form">
    <h2><a href="https://docs.easebuzz.in/" target="_blank">Transaction Status API ↗</a></h2>

    <form action="/easebuzz?api_name=transaction" method="POST">
      <h3>Mandatory Parameters</h3>
      <div class="mandatory-data">
        <div class="form-field">
          <label>Transaction ID<sup>*</sup></label>
          <input type="text" name="txnid" placeholder="2024-32" required pattern="^[a-zA-Z0-9_|/\-]{1,40}$" title="Only alphanumeric, _, |, -, / allowed. Max 40 chars.">
        </div>
      </div>

      <button type="submit" class="submit-btn">Get Transaction</button>
    </form>
  </div>

  <script src="/public/js/form-validation.js"></script>
  <script>
    document.getElementById('autoFillToggle').addEventListener('change', function() {
      const form = document.querySelector('form');
      if (this.checked) {
        form.txnid.value = '2024-32';
      } else {
        form.reset();
      }
    });
  </script>
</body>
</html>
