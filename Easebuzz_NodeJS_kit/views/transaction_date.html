<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Transaction Date V2 - Easebuzz</title>
  <link rel="stylesheet" href="/public/css/style.css">
</head>
<body>
  <div class="header">
    <div class="logo">
      <a href="/public/index.html"><img src="/public/images/Easebuzz_Logo_ White_Text.svg" alt="Easebuzz"></a>
    </div>
    <div class="nav-right">
      <div class="toggle-container">
        <span>Auto Fill Data</span>
        <label class="toggle-switch">
          <input type="checkbox" id="autoFillToggle">
          <span class="toggle-slider"></span>
        </label>
      </div>
      <a href="/public/index.html">Back</a>
    </div>
  </div>

  <div class="main-form">
    <h2><a href="https://docs.easebuzz.in/" target="_blank">Transaction Date API ↗</a></h2>

    <form action="/easebuzz?api_name=transaction_date" method="POST">
      <h3>Mandatory Parameters</h3>
      <div class="mandatory-data">
        <div class="form-field">
          <label>Start Date (DD-MM-YYYY)<sup>*</sup></label>
          <input type="text" name="start_date" placeholder="01-05-2025" required pattern="^\d{2}-\d{2}-\d{4}$" title="Date format: DD-MM-YYYY">
        </div>
        <div class="form-field">
          <label>End Date (DD-MM-YYYY)<sup>*</sup></label>
          <input type="text" name="end_date" placeholder="10-05-2025" required pattern="^\d{2}-\d{2}-\d{4}$" title="Date format: DD-MM-YYYY">
        </div>
      </div>

      <h3>Optional Parameters</h3>
      <div class="optional-data">
        <div class="form-field">
          <label>Merchant Email</label>
          <input type="email" name="merchant_email" placeholder="merchant@example.com">
        </div>
      </div>

      <button type="submit" class="submit-btn">Get Transactions</button>
    </form>
  </div>

  <script src="/public/js/form-validation.js"></script>
  <script>
    document.getElementById('autoFillToggle').addEventListener('change', function() {
      const form = document.querySelector('form');
      if (this.checked) {
        form.start_date.value = '01-05-2025';
        form.end_date.value = '10-05-2025';
      } else {
        form.reset();
      }
    });
  </script>
</body>
</html>
